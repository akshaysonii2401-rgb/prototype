<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🤖</div>

            <div>
                <h2>My Assistant</h2>
                <span>Personal AI</span>
            </div>
        </div>


        <button id="newChatBtn" class="new-chat">
            <span>＋</span>
            New chat
        </button>


        <div class="history-title">
            Recent chats
        </div>


        <div id="chatHistory" class="chat-history">
            <!-- Previous chats appear here -->
        </div>


        <div class="sidebar-bottom">

            <button class="side-button">
                ⚙️
                <span>Settings</span>
            </button>

            <div class="storage-status">
                ● Chats stored locally
            </div>

        </div>

    </aside>


    <!-- MAIN CHAT -->
    <main class="main">

        <!-- HEADER -->

        <header class="topbar">

            <button id="mobileMenu" class="mobile-menu">
                ☰
            </button>

            <div>
                <h3 id="chatTitle">New conversation</h3>
                <span class="online">
                    ● Personal assistant
                </span>
            </div>

        </header>


        <!-- CHAT AREA -->

        <section id="chatArea" class="chat-area">

            <!-- Welcome message -->

            <div id="welcome" class="welcome">

                <div class="welcome-icon">
                    🤖
                </div>

                <h1>How can I help you?</h1>

                <p>
                    Choose an option below or type your own message.
                </p>

            </div>

        </section>


        <!-- OPTIONS -->

        <section class="option-area">

            <div class="option-label">
                Choose an option
            </div>

            <div id="options" class="options">

                <button class="option-btn" data-option="Study">
                    📚
                    <span>Study</span>
                </button>

                <button class="option-btn" data-option="Coding">
                    💻
                    <span>Coding</span>
                </button>

                <button class="option-btn" data-option="Writing">
                    ✍️
                    <span>Writing</span>
                </button>

                <button class="option-btn" data-option="Projects">
                    🚀
                    <span>Projects</span>
                </button>

            </div>

        </section>


        <!-- MESSAGE BOX -->

        <div class="composer-container">

            <div class="composer">

                <textarea
                    id="messageInput"
                    placeholder="Message your assistant..."
                    rows="1"
                ></textarea>

                <button id="sendBtn" class="send-btn">
                    ➤
                </button>

            </div>

            <p class="composer-note">
                Your conversations are stored on this device.
            </p>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
